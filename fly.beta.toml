app = "runescape-agent-beta"
primary_region = "dfw"

[build]

[env]
  RS3_BETA_ENABLED = "true"
  RS3_BETA_LEDGER_PATH = "/data/beta-usage.sqlite"
  RUNESCAPE_RECOMMENDATIONS_ENABLED = "true"
  TYPESAFE_MODEL = "jev-1.14.0"
  DEBUG = "false"

[[mounts]]
  source = "beta_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
