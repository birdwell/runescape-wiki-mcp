name: Check MCP Registry release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check registry identity and package reference
        run: |
          jq -e --slurpfile pkg package.json '
            .name == $pkg[0].mcpName and
            .name == "io.github.birdwell/runescape-wiki-mcp" and
            any(.packages[]; .registryType == "npm" and .identifier == $pkg[0].name and .version == $pkg[0].version)
          ' server.json
          echo 'Publish the existing listing as birdwell using the release instructions in README.md.' >> "$GITHUB_STEP_SUMMARY"
