# Standard Dependabot config: one weekly grouped PR across every ecosystem
# (majors included), plus grouped security-update PRs per ecosystem.
version: 2

multi-ecosystem-groups:
  weekly-deps:
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Chicago
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: "bun"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
    # typescript is an npm alias of @typescript/typescript6. Dependabot matches
    # ignore rules on the name in the manifest or lockfile, and those differ:
    # the manifest key is "typescript", bun.lock's resolution name is
    # "@typescript/typescript6". Ignore majors for both until TS 7.1.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@typescript/typescript6"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
